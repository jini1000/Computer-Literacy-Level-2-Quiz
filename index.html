<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>컴퓨터활용능력 2급 필기 - 잘못된 문장 찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent; /* 모바일 터치 하이라이트 제거 */
        }
        .correct-answer {
            background-color: #d1fae5; 
            border-color: #10b981; 
        }
        .wrong-answer {
            background-color: #fee2e2; 
            border-color: #ef4444; 
        }
        .option-button {
            transition: all 0.2s ease-in-out;
        }
        @media (hover: hover) {
            .option-button:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }
        }
        /* 페이드 인 애니메이션 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        /* 스크롤바 숨기기 (깔끔한 UI) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="text-gray-800 sm:py-8 sm:px-4 flex justify-center min-h-screen">

    <div class="max-w-3xl w-full bg-white sm:rounded-2xl sm:shadow-xl flex flex-col min-h-screen sm:min-h-[85vh] relative overflow-hidden">
        
        <!-- Header -->
        <header class="bg-blue-600 text-white py-4 px-5 sm:py-6 sm:px-8 flex justify-between items-center z-10 shadow-sm">
            <div>
                <h1 class="text-lg sm:text-2xl font-bold tracking-tight">컴활 2급 필기</h1>
                <p class="text-blue-200 mt-0.5 text-xs sm:text-sm">잘못된 문장 찾기 100선</p>
            </div>
            <button id="score-btn" class="bg-blue-700 hover:bg-blue-800 text-white py-2 px-3 sm:px-4 rounded-lg text-sm sm:text-base font-semibold transition active:scale-95 shadow-inner">
                점수 확인
            </button>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 h-1.5 sm:h-2">
            <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-300 ease-out" style="width: 0%"></div>
        </div>

        <main class="flex-grow p-5 sm:p-8 flex flex-col relative bg-gray-50/50">
            
            <div id="question-container" class="flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-4 sm:mb-6">
                    <h2 id="question-number" class="text-sm sm:text-base font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">문제 1 / 100</h2>
                </div>
                
                <h3 id="question-text" class="text-lg sm:text-xl font-bold mb-6 sm:mb-8 leading-snug sm:leading-relaxed text-gray-800 break-keep">
                    문제 내용이 여기에 표시됩니다.
                </h3>
                
                <!-- Options (Flexbox 적용으로 모바일에서 글자 줄바꿈 꼬임 방지) -->
                <div id="options-container" class="space-y-3 sm:space-y-4 mb-8">
                    <!-- 버튼들이 자바스크립트로 생성됩니다 -->
                </div>

                <!-- Explanation Section -->
                <div id="explanation-container" class="mt-4 hidden animate-fade-in-up mb-6">
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 sm:p-5 rounded-r-xl">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <h4 class="font-bold text-blue-900 text-sm sm:text-base">해설</h4>
                        </div>
                        <p id="explanation-text" class="text-gray-700 text-sm sm:text-base leading-relaxed break-keep">
                            해설 내용이 여기에 표시됩니다.
                        </p>
                    </div>
                </div>
            </div>

            <div class="mt-auto pt-4 flex justify-end">
                <button id="next-btn" class="w-full sm:w-auto bg-gray-800 hover:bg-gray-700 active:bg-gray-900 text-white py-3.5 sm:py-3 px-8 rounded-xl sm:rounded-lg font-bold text-lg sm:text-base transition shadow-md hidden">
                    다음 문제
                </button>
            </div>

            <!-- Result Modal -->
            <div id="result-modal" class="absolute inset-0 bg-white/90 backdrop-blur-md z-20 hidden flex-col justify-center items-center p-6 text-center">
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">현재까지의 결과</h2>
                <p class="text-gray-500 mb-6 text-sm sm:text-base">꾸준히 연습하면 반드시 합격합니다!</p>
                
                <div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-xl border border-gray-100 mb-8">
                    <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-100">
                        <span class="text-gray-600 font-medium">푼 문제 수</span>
                        <span id="modal-answered" class="text-xl font-bold text-gray-800">0 / 100</span>
                    </div>
                    <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-100">
                        <span class="text-gray-600 font-medium">맞은 문제 수</span>
                        <span id="modal-correct" class="text-xl font-bold text-green-600">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600 font-medium">정답률</span>
                        <span id="modal-percentage" class="text-3xl font-black text-blue-600">0%</span>
                    </div>
                </div>
                
                <button id="close-modal-btn" class="w-full sm:w-auto min-w-[200px] bg-blue-600 hover:bg-blue-700 active:scale-95 text-white py-3.5 px-8 rounded-xl font-bold text-lg transition shadow-lg">
                    계속 풀기
                </button>
            </div>
        </main>
    </div>

    <script>
        // PDF 100문항 데이터 파싱 (66번, 67번 중복 포함하여 정확히 100개 구성)
        const rawData = [
            {q:"다음 중 그래픽 데이터 형식에 관한 설명으로 옳지 않은 것은?",o:["BMP: Windows 운영체제의 표준 비트맵 파일 형식으로 압축하여 저장하므로 파일의 크기가 작은 편이다.","GIF: 인터넷 표준 그래픽 형식으로 8비트 컬러를 사용하여 최대 256 색상까지만 표현할 수 있으며, 애니메이션 표현이 가능하다.","JPEG: 사진과 같은 선명한 정지 영상 압축 기술에 대한 국제 표준으로 주로 인터넷에서 그림 전송에 사용된다.","PNG: 트루 컬러의 지원과 투명색 지정이 가능하다."],a:0,e:"BMP 파일 형식은 압축을 하지 않으므로 파일의 크기가 큽니다."},
            {q:"한글 Windows 10의 [휴지통]에 관한 설명으로 옳지 않은 것은?",o:["[휴지통 비우기]를 실행한 파일은 [휴지통]에서 다시 복구할 수 있다.","[휴지통]에 있는 파일의 아이콘을 정렬하여 표시할 수 있다.","[휴지통]에 있는 파일을 바탕 화면 또는 다른 폴더에 끌어놓기를 하여 파일을 복구할 수 있다.","[휴지통]에 있는 파일을 더블클릭하면 '속성' 창이 표시된다."],a:0,e:"비워버린 휴지통은 되돌릴 수 없습니다."},
            {q:"다음 중 컴퓨터에서 사용하는 하드디스크의 파티션에 대한 설명으로 옳지 않은 것은?",o:["하나의 물리적인 하드디스크를 여러 개의 파티션으로 나눌 수 있다.","파티션을 나눈 후에 하드디스크를 사용하기 위해서는 포맷을 해야 한다.","하나의 하드디스크 내의 모든 파티션에는 동일한 운영체제만 설치할 수 있다.","하나의 파티션에는 한 가지 파일 시스템만을 설치할 수 있다."],a:2,e:"파티션 별로 서로 다른 운영체제를 설치할 수 있습니다."},
            {q:"다음 중 플래시 메모리(Flash Memory)에 관한 설명으로 옳지 않은 것은?",o:["정보의 입출력이 자유롭고, 전송속도가 빠르다.","비휘발성 기억장치이다.","트랙 단위로 저장된다.","전력 소모가 적다."],a:2,e:"플래시 메모리는 트랙 단위가 아닌 블록 단위로 저장됩니다."},
            {q:"다음 중 한글 Windows 10의 [폴더 옵션]에서 설정할 수 있는 작업에 해당되지 않는 것은?",o:["숨김 파일 및 폴더를 표시할 수 있다.","색인된 위치에서는 파일 이름뿐만 아니라 내용도 검색하도록 설정할 수 있다.","숨긴 파일 및 폴더의 숨김 속성을 일괄 해제할 수 있다.","파일이나 폴더를 한 번 클릭해서 열 것인지, 두 번 클릭해서 열 것인지를 설정할 수 있다."],a:2,e:"숨김 폴더/파일의 숨김 속성을 해제하려면 해당 폴더/파일의 속성 대화상자에서 '숨김'의 체크를 해제해야 합니다."},
            {q:"다음 중 한글 Windows 10의 인쇄 기능에 대한 설명으로 옳지 않은 것은?",o:["기본 프린터란 인쇄 시 특정 프린터를 지정하지 않아도 자동으로 인쇄되는 프린터를 말한다.","프린터 속성 창에서 공급용지의 종류, 공유, 포트 등을 설정할 수 있다.","인쇄 대기 중인 작업은 취소시킬 수 있다.","인쇄 중인 작업은 취소할 수는 없으나 잠시 중단시킬 수 있다."],a:3,e:"인쇄 대기중인 문서뿐만 아니라 인쇄 중인 문서도 취소(삭제)할 수 있습니다."},
            {q:"다음 중 파일 및 폴더에 대한 설명으로 옳은 것은?",o:["파일과 폴더에 대한 바로 가기 아이콘을 바탕 화면에 만들 수 있다.","하나의 폴더 내에는 동일한 이름의 파일이나 폴더가 존재할 수 있다.","하위 폴더가 있는 폴더는 삭제할 수 없다.","파일과 폴더의 이름으로 */?\\:<>\'\"| 등의 특수 문자나 공백을 사용할 수 없다."],a:0,e:"하나의 폴더 내에는 동일한 이름의 파일/폴더가 존재할 수 없고, 하위 폴더도 삭제할 수 있으며, 공백을 사용할 수 있습니다."},
            {q:"다음 중 디지털 컴퓨터와 아날로그 컴퓨터의 차이점에 관한 설명으로 옳은 것은?",o:["디지털 컴퓨터는 전류, 전압, 온도 등 다양한 입력값을 처리하며, 아날로그 컴퓨터는 숫자 데이터만을 처리한다.","디지털 컴퓨터는 증폭 회로로 구성되며, 아날로그 컴퓨터는 논리 회로로 구성된다.","아날로그 컴퓨터는 미분이나 적분 연산을 주로 하며, 디지털 컴퓨터는 산술이나 논리 연산을 주로 한다.","아날로그 컴퓨터는 범용이며, 디지털 컴퓨터는 특수 목적용으로 많이 사용된다."],a:2,e:"아날로그 컴퓨터는 미분/적분, 증폭 회로, 특수 목적용이며 연속적 데이터를 처리합니다."},
            {q:"다음 중 파일 및 폴더에 대한 설명으로 옳지 않은 것은?",o:["하나의 폴더 내에는 동일한 이름의 파일이나 폴더가 존재할 수 없다.","파일과 폴더의 이름은 255자 이내로 작성한다.","파일과 폴더의 이름으로 */?\\:<>\'\"| 등의 특수 문자나 공백을 사용할 수 없다.","파일은 파일명과 확장자로 구성되며, 마침표(.)를 이용하여 파일명과 확장자를 구분한다"],a:2,e:"파일과 폴더의 이름으로 공백을 사용할 수 있습니다."},
            {q:"다음 중 Windows에서 바로 가기 아이콘에 대한 설명으로 옳지 않은 것은?",o:["원본 파일이 있는 위치와 관계없이 만들 수 있다.","하나의 원본 파일에 대하여 여러 개의 바로 가기 아이콘을 만들 수 없다.","바로 가기 아이콘의 확장자는 LNK이다.","원본 파일을 삭제하면 바로 가기 아이콘을 실행할 수 없다."],a:1,e:"하나의 원본 파일에 대하여 여러 개의 바로 가기 아이콘을 만들 수 있습니다."},
            {q:"다음 중 폴더의 [속성] 창에 대한 설명으로 옳지 않은 것은?",o:["폴더의 저장 위치를 변경할 수 있다.","폴더가 포함하고 있는 하위 폴더 및 파일의 개수를 알 수 있다.","폴더에 '읽기 전용' 속성을 설정하거나 해제할 수 있다.","해당 폴더의 만든 날짜를 알 수 있다."],a:0,e:"폴더의 [속성] 창에서 폴더의 저장 위치를 확인할 수 있지만 변경할 수는 없습니다."},
            {q:"다음 중 컴퓨터를 관리하는 효율적인 방법으로 옳지 않은 것은?",o:["컴퓨터를 이동하거나 부품 교체 시 전원을 끄고 작업하는 것이 바람직하다.","시스템에 문제가 발생하면 시스템을 재부팅하고 하드디스크의 모든 파티션을 제거한다.","바이러스 백신을 사용하여 감염을 방지하며 중요한 데이터는 백업한다.","불필요한 프로그램은 설치하지 않으며 정기적으로 시스템을 점검한다."],a:1,e:"파티션을 제거하면 내용도 모두 삭제되므로 [복구]를 통해 해결하는 것이 좋습니다."},
            {q:"컴퓨터 시스템에서 사용하는 채널(Channel)에 관한 설명으로 옳지 않은 것은?",o:["주변장치에 대한 제어 권한을 CPU로 부터 넘겨받아 CPU 대신 입출력을 관리한다.","입출력 작업이 끝나면 CPU에게 인터럽트 신호를 보낸다.","CPU와 주기억장치의 속도 차이를 해결하기 위하여 사용된다.","채널에는 셀렉터, 멀티플랙서, 블록 멀티플랙서 등이 있다."],a:2,e:"채널은 CPU와 입출력장치 사이의 속도 차이를 해결합니다. (주기억장치는 캐시 메모리)"},
            {q:"컴퓨터의 저장 매체 관리 방법으로 옳지 않은 것은?",o:["예상치 않은 상황에 대비하여 주기적으로 백업하여 둔다.","강한 자성 물체를 외장 하드디스크 주위에 놓지 않는다.","주기적으로 디스크 정리, 검사, 조각 모음을 수행한다.","오랜 기간 동안 저장된 데이터는 재저장한다."],a:3,e:"보조기억장치에 저장된 자료는 영구적이므로 재저장은 무의미합니다. 백업하는 것이 바람직합니다."},
            {q:"근거리 통신망(LAN)에 관한 설명으로 옳지 않은 것은?",o:["비교적 전송 거리가 짧아 에러 발생률이 낮다.","반이중 방식의 통신을 한다.","자원 공유를 목적으로 컴퓨터들을 상호 연결한다.","프린터, 보조기억장치 등 주변장치들을 쉽게 공유할 수 있다."],a:1,e:"근거리 통신망(LAN)은 전이중 방식의 통신을 합니다."},
            {q:"한글 Windows 10의 [메모장]에 대한 설명으로 옳지 않은 것은?",o:["작성한 문서를 저장할 때 확장자는 기본적으로 .txt가 부여된다.","특정한 문자열을 찾을 수 있는 찾기 기능이 있다.","그림, 차트 등의 OLE 개체를 삽입할 수 있다.","현재 시간/날짜를 삽입하는 기능이 있다."],a:2,e:"메모장에서는 그림, 차트 등의 OLE 개체를 삽입할 수 없습니다."},
            {q:"컴퓨터에서 사용되는 바이트(Byte)에 대한 설명으로 옳지 않은 것은?",o:["1바이트는 8비트로 구성된다.","일반적으로 영문자나 숫자는 1Byte로, 한글 및 한자는 2Byte로 표현한다.","1바이트는 컴퓨터에서 각종 명령을 처리하는 기본 단위이다.","1바이트로는 256가지의 정보를 표현할 수 있다."],a:2,e:"바이트는 문자를 표현하는 최소 단위이며, 명령 처리의 기본 단위는 워드(Word)입니다."},
            {q:"인터넷 주소 체계인 IPv6에 대한 설명으로 옳지 않은 것은?",o:["주소는 16비트씩 8개 부분으로 총 128비트로 구성되어 있다.","IPv6의 주소는 유니캐스트, 애니캐스트, 멀티캐스트 3종류의 형태로 분류한다.","IPv4와의 호환성은 낮으나 IPv4에 비해 품질 보장은 용이하다.","주소에 0이 연속되는 경우 0을 생략하고 '::' 형태로 표시할 수 있다."],a:2,e:"IPv6은 IPv4와의 호환성이 매우 뛰어납니다."},
            {q:"한글 Windows 10 [디스플레이] 설정에서 할 수 없는 것은?",o:["테마 기능을 이용하여 바탕 화면의 배경, 창 색, 소리 및 화면 보호기를 변경할 수 있다.","연결되어 있는 모니터의 개수를 감지하고 모니터의 방향과 해상도를 설정할 수 있다.","화면에 표시되는 텍스트를 읽기 쉽도록 크기를 변경할 수 있다.","눈의 피로를 적게 하기 위한 야간 모드를 지정할 수 있다."],a:0,e:"테마는 [설정] → [개인 설정] → [테마]에서 설정할 수 있습니다."},
            {q:"[설정] → [개인 설정]에 관한 설명 중 옳지 않은 것은?",o:["바탕 화면의 배경을 사용자가 임의로 바꿀 수 있게 지원한다.","시스템을 켜둔 채 사용하지 않으면 화면 보호기 작동 여부를 설정한다.","창의 색상과 구성 요소의 색상을 설정한다.","모니터의 해상도 및 방향을 설정한다."],a:3,e:"모니터의 해상도와 방향은 [시스템] → [디스플레이]에서 설정할 수 있습니다."},
            {q:"정보 사회의 특징으로 적절하지 않은 것은?",o:["정보처리 기술의 발달로 사회의 변화 속도가 빨라졌다.","사이버 공간 상에 새로운 인간관계와 문화가 형성되었다.","통신 기술의 발달로 시간과 공간의 제약에서 벗어나게 되었다.","컴퓨터를 통한 정보 처리 기술의 발달로 인해 정보의 양이 감소하였다."],a:3,e:"정보 사회에서는 정보의 양이 폭발적으로 증가하였습니다."},
            {q:"드라이브 조각 모음 및 최적화 기능에 관한 설명으로 옳지 않은 것은?",o:["하드디스크에 단편화되어 조각난 파일들을 모아준다.","이동식 저장장치도 드라이브 조각 모음을 수행할 수 있다.","수행 후에는 디스크 공간의 최적화가 이루어져 디스크 용량이 증가한다.","일정을 구성하여 예약 실행할 수 있다."],a:2,e:"드라이브 조각 모음은 접근 속도를 향상시키는 것이며 디스크 용량 증가와는 관계 없습니다."},
            {q:"정보 보안을 위협하는 유형에 대한 설명으로 옳지 않은 것은?",o:["가로막기는 데이터의 정상적인 전달을 막아 흐름을 방해하는 행위이다.","수정은 전송된 데이터가 원래의 데이터가 아닌 다른 내용으로 바꾸는 행위이다.","가로채기는 송신된 데이터가 수신지까지 가는 회선을 절단하는 행위이다.","위조는 다른 송신자로부터 데이터가 송신된 것처럼 꾸미는 행위이다."],a:2,e:"가로채기는 도중에 몰래 보거나 도청하여 정보를 유출하는 행위입니다. 회선 절단은 가로막기입니다."},
            {q:"USB 장치에 관한 설명으로 옳지 않은 것은?",o:["주변장치를 127개까지 연결할 수 있다.","컴퓨터 전원이 켜진 상태에서도 장치를 연결하거나 제거할 수 있다.","기존 포트들을 대체하기 위한 범용 직렬 버스이다.","한 번에 8비트의 데이터가 동시에 전송되는 방식을 사용한다."],a:3,e:"USB는 직렬 포트로서 1비트씩 전송합니다. 8비트 동시 전송은 병렬 포트입니다."},
            {q:"운영체제의 운용 방식으로 옳지 않은 것은?",o:["일괄 처리는 데이터를 모았다가 한꺼번에 처리하는 시스템으로, 오프라인으로만 사용한다.","시분할 시스템은 여러 사용자가 동시에 사용하는 시스템이다.","실시간 처리 시스템은 데이터가 생겨날 때마다 바로 처리하는 시스템이다.","분산 처리 시스템은 분산된 컴퓨터를 연결하여 분담 처리하는 시스템이다."],a:0,e:"일괄 처리 시스템은 오프라인뿐만 아니라 온라인에서도 흔히 사용됩니다."},
            {q:"'작업 관리자'에서 수행할 수 있는 작업으로 옳지 않은 것은?",o:["컴퓨터를 이용하는 사용자 계정의 추가와 삭제를 수행할 수 있다.","현재 실행 중인 앱을 강제로 종료시킬 수 있다.","시스템의 CPU 사용 내용이나 할당된 메모리의 크기를 파악할 수 있다.","현재 네트워크 상태를 보고 네트워크 처리량을 확인할 수 있다."],a:0,e:"사용자 계정의 추가 및 삭제는 [설정] → [계정]을 이용해야 합니다."},
            {q:"컴퓨터 범죄 예방과 대책에 관한 설명으로 옳지 않은 것은?",o:["해킹 여부를 정기적으로 검사한다.","의심이 가는 이메일은 열어서 내용을 확인하고 삭제한다.","백신 프로그램을 설치하고 자동 업데이트 기능을 설정한다.","회원 가입한 사이트의 패스워드를 주기적으로 변경한다."],a:1,e:"의심 가는 이메일은 열어보지 않고 바로 삭제하거나 검사 후 열어야 합니다."},
            {q:"멀티미디어에 대한 설명으로 옳지 않은 것은?",o:["정보 제공자와 수신자 간의 의사소통을 통해 쌍방향 전달이 가능하다.","미디어의 용량이 적어 다양한 매체에 사용할 수 있다.","멀티미디어 정보를 저장하기 위해 다양한 저장매체의 사용이 가능하다.","텍스트, 그래픽, 사운드, 동영상 등을 통합해 전달한다."],a:1,e:"멀티미디어 데이터는 용량이 매우 크기 때문에 압축 기술이 필요합니다."},
            {q:"'작업 표시줄'에서 할 수 있는 작업으로 옳지 않은 것은?",o:["같은 종류의 작업 표시줄 단추를 그룹으로 표시하도록 설정할 수 있다.","아이콘 보기 형식과 정렬을 지정할 수 있다.","작업 표시줄 잠금을 설정할 수 있다.","작업 표시줄이 항상 나타나지 않도록 숨기기를 설정할 수 있다."],a:1,e:"아이콘 보기 형식과 정렬은 파일 탐색기의 [보기] 탭에서 지정할 수 있습니다."},
            {q:"하이퍼텍스트(Hypertext)에 대한 설명으로 옳지 않은 것은?",o:["하이퍼텍스트는 텍스트가 링크로 연결되어 있는 문서이다.","동영상, 그래픽 등의 정보를 연결해 놓은 멀티미디어 형식이다.","사용자가 하이퍼링크를 클릭함으로써 원하는 데이터를 찾을 수 있다.","사용자의 의도에 따라 문서를 읽는 순서가 결정되는 비선형 구조이다."],a:1,e:"동영상, 그래픽 등의 정보를 연결해 놓은 멀티미디어 형식은 하이퍼미디어(Hypermedia)입니다."},
            {q:"WWW(World Wide Web)에 대한 설명으로 잘못된 것은?",o:["멀티미디어 형식의 정보를 제공한다.","HTTP 프로토콜을 사용하는 하이퍼텍스트 기반으로 되어 있다.","웹 페이지는 서버에서 정보를 제공하고 클라이언트가 웹 브라우저를 통해 제공받는다.","HTML은 웹 브라우저 사이에서 하이퍼텍스트 문서를 전송하기 위해 사용하는 프로토콜이다."],a:3,e:"HTML은 언어이며, 문서를 전송하기 위한 프로토콜은 HTTP입니다."},
            {q:"컴퓨터에서 사용하는 유니코드(Unicode)에 관한 설명으로 옳은 것은?",o:["표현 가능한 문자 수는 최대 256자이다.","에러 검출이나 교정이 가능한 코드이다.","연산을 빠르게 수행하기 위하여 Zone 비트와 Digit 비트로 구성한다.","데이터의 처리나 교환을 위하여 1개 문자를 16비트로 표현한다."],a:3,e:"유니코드는 16비트(최대 65,536자)를 사용합니다."},
            {q:"IP의 특징으로 옳지 않은 것은?",o:["DHCP를 통해 IP를 동적으로 사용할 수 있다.","IPv6은 네트워크 부분의 길이에 따라 5개의 클래스로 나뉜다.","IPv4는 32비트를 가진다.","IPv6는 128비트를 가진다."],a:1,e:"IPv4가 5개의 클래스로 나뉘며, IPv6은 유니캐스트, 애니캐스트, 멀티캐스트로 구분됩니다."},
            {q:"컴퓨터 CPU 레지스터(Register)에 관한 설명으로 옳지 않은 것은?",o:["프로그램 카운터는 다음에 수행할 명령어 주소를 저장한다.","CPU 내에서 자료를 일시적으로 저장하는 장치이다.","주기억장치보다 저장 용량이 적고 속도가 느리다.","계산 결과 임시 저장 등 여러 목적으로 쓰이는 레지스터를 범용 레지스터라 한다."],a:2,e:"레지스터는 CPU 내부에 있어 주기억장치보다 속도가 훨씬 빠릅니다."},
            {q:"전자우편(E-mail)에 대한 설명으로 옳지 않은 것은?",o:["SMTP는 작성한 메일을 수신자 계정에 전송하는 프로토콜이다.","동시에 여러 사람에게 동일한 전자우편을 보낼 수 있다.","POP3는 멀티미디어 파일 내용을 확인하고 실행시켜 주는 프로토콜이다.","불특정 다수에게 대량으로 보내는 광고성 메일을 스팸 메일이라 한다."],a:2,e:"POP3는 메일 서버에서 이메일을 가져오는 프로토콜입니다. 멀티미디어는 MIME입니다."},
            {q:"버전에 따른 소프트웨어 설명으로 옳지 않은 것은?",o:["트라이얼 버전은 하드웨어나 소프트웨어를 구매했을 때 무료로 주는 프로그램이다.","베타 버전은 정식 발표 전 테스트를 위해 무료로 배포하는 프로그램이다.","데모 버전은 홍보를 위해 기능/기간을 제한하여 배포하는 프로그램이다.","패치 버전은 오류 수정이나 성능 향상을 위해 배포하는 프로그램이다."],a:0,e:"구매 시 무료로 주는 것은 번들(Bundle)입니다. 트라이얼은 맛보기용입니다."},
            {q:"컴파일러와 인터프리터의 비교로 틀린 것은?",o:["번역 단위: 컴파일러(전체) / 인터프리터(한줄)","목적 프로그램: 컴파일러(생성) / 인터프리터(없음)","실행 속도: 컴파일러(빠름) / 인터프리터(느림)","번역 속도: 컴파일러(빠름) / 인터프리터(느림)"],a:3,e:"컴파일러는 전체 번역으로 번역 속도가 느리고, 인터프리터는 한 줄 번역으로 번역 속도가 빠릅니다."},
            {q:"컴퓨터의 기억장치에 관한 설명으로 옳은 것은?",o:["캐시 메모리: CPU와 주기억장치 사이에서 처리 속도를 향상시키기 위한 것","가상 메모리: 내용의 일부를 이용하여 직접 접근하는 장치","연관 메모리: 보조기억장치 일부를 주기억장치처럼 사용하는 기법","버퍼 메모리: 데이터 전송 속도가 빠른 비휘발성 메모리"],a:0,e:"가상 메모리는 보조를 주처럼, 연관 메모리는 내용을 이용해 접근하는 장치입니다."},
            {q:"사물 인터넷(IoT)에 대한 설명으로 옳지 않은 것은?",o:["디바이스는 빅데이터를 수집하며 클라우드와 AI가 분석한다.","사물, 사람, 공간을 연결하여 지능화된 서비스를 자율 제공한다.","데이터를 분석해 스스로 사물에 의사결정을 내리는 단계로 발전하고 있다.","통신 비용이 절감되는 효과가 있으며 정보 보안 적용이 용이하다."],a:3,e:"IoT는 인터넷 기반이라 통신비용이 발생할 수 있고 연결 기기가 많아 보안 적용이 취약합니다."},
            {q:"데이터 입력에 대한 설명으로 옳지 않은 것은?",o:["동일 문자를 여러 셀에 입력하려면 셀에 문자를 입력 후 채우기 핸들을 드래그한다.","숫자의 경우 두 셀을 선택 후 핸들을 드래그하면 두 값의 차이만큼 증감한다.","동일 데이터를 한 번에 입력하려면 범위를 지정해 입력 후 [Shift]+[Enter]를 누른다.","사용자 지정 연속 데이터 채우기 목록엔 텍스트나 텍스트/숫자 조합만 포함된다."],a:2,e:"여러 셀에 동일 데이터를 한 번에 입력하려면 [Ctrl]+[Enter]를 누릅니다."},
            {q:"'셀 항목 자동 완성' 기능에 대한 설명으로 옳지 않은 것은?",o:["숫자 또는 날짜만으로 구성된 내용에는 적용되지 않는다.","'셀 내용을 자동 완성' 옵션이 설정되어 있어야 실행된다.","나머지 글자가 자동으로 채워진 항목을 입력하려면 [Enter]를 누른다.","한글이나 영어로만 구성된 항목에 적용되는 기능이다."],a:3,e:"셀 내용 자동 완성은 한글/영어가 '포함된' 문자열 데이터에 모두 적용됩니다."},
            {q:"셀의 이동과 복사에 대한 설명으로 옳지 않은 것은?",o:["잘라내기 [Ctrl]+[X]를 누르면 선택 영역 주위에 점선이 표시된다.","클립보드에는 최대 24개 항목이 저장 가능하여 한 번에 붙여넣을 수 있다.","셀 영역을 드래그하는 동안에는 테두리만 표시된다.","[Shift]를 누른 채 선택 영역 테두리를 드래그하면 복사된다."],a:3,e:"[Shift]를 누르고 드래그하면 '이동'되고, [Ctrl]을 누르고 드래그해야 '복사'됩니다."},
            {q:"찾기 및 바꾸기에 대한 설명으로 옳지 않은 것은?",o:["물음표(?)는 길이를 제한하고, 별표(*)는 길이에 상관없이 검색한다.","서식을 사용하면 서식 조건에 맞는 셀을 검색할 수 있다.","현재 통합 문서의 모든 시트를 검색하려면 '통합 문서'를 선택한다.","찾는 위치 항목에서 '수식'으로 입력하면 계산된 결과에서 검색한다."],a:3,e:"'수식'으로 지정하면 계산 결과가 아닌 수식 텍스트 안에서 검색합니다."},
            {q:"원형 차트에 대한 설명으로 옳지 않은 것은?",o:["차트의 각 조각을 분리하거나 첫째 조각의 각을 조정할 수 있다.","전체 항목의 합에 대한 각 항목의 비율을 표시할 수 있다.","여러 개의 데이터 계열을 표현할 수 있다.","중요한 요소를 강조할 때 사용한다."],a:2,e:"원형 차트는 항상 '하나'의 데이터 계열만을 표시할 수 있습니다."},
            {q:"셀 참조에 대한 설명으로 옳지 않은 것은?",o:["다른 시트 셀은 참조할 수 있으나 다른 통합 문서의 셀은 참조할 수 없다.","빈 셀을 참조하여 나누기를 하면 #DIV/0! 오류값이 표시된다.","자주 사용하는 셀이나 범위에 이름을 지정하여 활용할 수 있다.","절대 참조 방식은 참조되는 셀 위치가 고정되어 있는 방식이다."],a:0,e:"다른 통합 문서 내의 셀도 수식에서 참조할 수 있습니다."},
            {q:"데이터 행이 2개인 원본 데이터를 이용하여 작성할 수 없는 차트는?",o:["묶은 가로 막대형 차트","표식이 있는 꺾은선형 차트","주식형 차트","방사형 차트"],a:2,e:"주식형 차트는 데이터 행과 데이터 계열이 최소 3개 이상 있어야 작성 가능합니다."},
            {q:"날짜 및 시간 데이터에 관한 설명으로 옳지 않은 것은?",o:["일을 입력하지 않으면 자동으로 해당 월의 1일로 입력된다.","셀에 4/9를 입력하고 [Enter]를 누르면 04월 09일로 표시된다.","날짜 및 시간 데이터는 자동으로 오른쪽 정렬된다.","[Ctrl]+[:]을 누르면 현재 시간, [Ctrl]+[Shift]+[:]을 누르면 오늘 날짜가 입력된다."],a:3,e:"[Ctrl]+[:]은 오늘 날짜, [Ctrl]+[Shift]+[:]은 현재 시간이 입력됩니다."},
            {q:"피벗 테이블 삽입 위치에 대한 설명으로 옳지 않은 것은? (원본 그림 생략)",o:["피벗 테이블 보고서는 필터 영역을 포함한 가장 왼쪽 위를 기준으로 삽입된다.","'직업' 필드를 필터 영역에 설정하였다.","총합계는 열의 총합계만 표시되도록 설정하였다.","행 영역의 필드에 그룹화를 설정하였다."],a:0,e:"피벗 테이블 삽입 기준 위치는 '필터 영역을 제외한' 행과 열이 만나는 가장 왼쪽 위 모서리입니다."},
            {q:"'페이지 설정' 대화상자에 대한 설명으로 옳지 않은 것은?",o:["프린터 목록에서 사용할 프린터를 선택할 수 있다.","셀 오류 표시 여부를 지정할 수 있다.","가로/세로 가운데 맞춤으로 인쇄되도록 설정할 수 있다.","셀 구분선이 인쇄되도록 설정할 수 있다."],a:0,e:"사용할 프린터 선택은 페이지 설정 창이 아닌 [파일] → [인쇄] 메뉴에서 합니다."},
            {q:"행/열 전환을 수행할 때 나타나는 현상으로 옳지 않은 것은?",o:["'계열 겹치기' 값이 음수로 지정된다.","가로(항목) 축의 데이터와 범례 항목이 서로 변경된다.","데이터 계열의 위치가 바뀐다.","X축과 범례의 내용이 스와프된다."],a:0,e:"계열 겹치기 값은 데이터 자체의 행/열 전환과는 직접 관련이 없습니다."},
            {q:"시나리오 요약 보고서에 대한 설명으로 옳지 않은 것은?",o:["값의 변화에 따른 평균 값을 확인할 수 있다.","여러 시나리오에 대한 요약 보고서이다.","시나리오의 값을 변경하면 요약 보고서에 자동으로 다시 계산되어 표시된다.","실행하기 전 변경 셀과 결과 셀의 이름을 정의하였다."],a:2,e:"원본 시나리오 값을 변경해도 이미 작성된 요약 보고서에는 자동으로 갱신 반영되지 않습니다."},
            {q:"각 차트에 대한 설명으로 옳지 않은 것은?",o:["꺾은선형 차트: 하나의 계열만 갖는 차트로 3차원 표현이 불가능하다.","방사형 차트: 여러 데이터 계열의 집계 값을 비교하기 용이하다.","분산형 차트: 숫자 값 사이의 관계를 xy 좌표로 표시한다.","원형 차트: 각 항목의 구성 비율이나 기여도를 나타낼 때 사용한다."],a:0,e:"꺾은선형 차트는 여러 계열을 가질 수 있으며 3차원 차트로 표현 가능합니다."},
            {q:"[매크로 기록] 대화상자에 대한 설명으로 옳지 않은 것은?",o:["매크로 이름 변경은 [매크로] 대화상자에서만 할 수 있다.","작성된 매크로는 'Personal.xlsb'에 저장된다.","설명은 일종의 주석으로 반드시 지정하지 않아도 된다.","바로 가기 키를 눌러 실행할 수 있다."],a:0,e:"매크로 이름은 Visual Basic Editor (VBE) 창에서도 변경 가능합니다."},
            {q:"피벗 테이블에 대한 설명으로 옳지 않은 것은?",o:["값 영역을 더블클릭하면 세부 데이터가 새로운 시트에 표시된다.","데이터 그룹 수준을 확장/축소하여 요약이나 세부 데이터를 표시할 수 있다.","행을 열로 이동하여 다양하게 요약 표시할 수 있다.","피벗 테이블과 피벗 차트를 만든 후 피벗 테이블을 삭제하면 피벗 차트도 자동 삭제된다."],a:3,e:"피벗 테이블 삭제 시 연결된 피벗 차트는 자동 삭제되지 않고 일반 차트로 변경됩니다."},
            {q:"이름 정의 기능에 대한 설명으로 옳지 않은 것은? (선택 영역 그림 참고)",o:["[선택 영역에서 이름 만들기] 실행 시 항상 단일 셀 이름만 정의된다.","[선택 영역에서 이름 만들기] 첫 행을 선택하면 가장 위 데이터가 이름이 된다.","[선택 영역에서 이름 만들기] 왼쪽 열을 선택하면 가장 왼쪽 데이터가 이름이 된다.","정의된 이름은 모든 시트에서 사용할 수 있으며 편집할 수 있다."],a:0,e:"설명 상 지정된 전체 영역 또는 여러 열 영역에 대한 다중 이름 정의가 가능합니다."},
            {q:"여러 워크시트를 그룹 설정한 경우에 대한 설명으로 옳지 않은 것은?",o:["엑셀 창의 제목 표시줄에 [그룹]이라고 표시된다.","그룹 상태에서 도형, 차트 등의 그래픽 개체는 삽입되지 않는다.","그룹 상태에서는 정렬 및 필터 기능을 수행할 수 없다.","하나의 시트를 선택하고 [이동/복사]를 수행하면 현재 선택된 시트만 복사된다."],a:3,e:"그룹 상태에서 [이동/복사]를 수행하면 그룹으로 설정된 모든 시트가 함께 이동/복사됩니다."},
            {q:"차트에 표시되지 않는 구성 요소를 찾을 때 틀린 것은?",o:["데이터 테이블","범례","눈금선","데이터 레이블"],a:3,e:"데이터 레이블(값 표시)은 기본 요소가 아니며 표시되지 않을 수 있습니다."},
            {q:"인쇄에 대한 설명으로 옳은 것은?",o:["숨기기를 실행한 영역도 인쇄된다.","도형을 인쇄하려면 '개체 인쇄'를 선택하여 인쇄한다.","차트만 인쇄하려면 차트가 선택된 상태에서 인쇄 명령을 실행한다.","여러 시트를 인쇄하려면 '여러 시트 인쇄'를 선택해야 한다."],a:2,e:"차트가 선택된 상태에서 인쇄하면 해당 차트만 인쇄됩니다. 여러 시트 인쇄는 시트 전체 선택 후 활성 시트 인쇄입니다."},
            {q:"[데이터 계열 서식] 수정에 대한 설명 중 옳지 않은 것은?",o:["[계열 겹치기]는 -100%에서 100%까지이다.","[간격 너비]는 0%에서 500%까지이다.","[요소마다 다른 색 사용]에 체크하면 막대 색이 달라진다.","[간격 너비]의 숫자를 늘리면 각 막대의 너비가 커진다."],a:3,e:"간격 너비를 늘리면 막대 사이 간격이 커지고, 상대적으로 막대 자체의 너비는 줄어듭니다."},
            {q:"조건부 서식에 대한 설명으로 틀린 것은?",o:["조건에 맞지 않을 경우에 대한 서식도 함께 지정할 수 있다.","조건부 서식은 기존의 셀 서식에 우선하여 적용된다.","조건을 수식으로 입력할 경우 등호(=)를 반드시 입력해야 한다.","값이 변경되어 조건에 만족하지 않을 경우 적용된 서식은 해제된다."],a:0,e:"조건부 서식은 '조건에 맞는 경우'의 서식만 지정할 수 있습니다."},
            {q:"[페이지 설정] 대화상자의 [시트] 탭에 대한 설명으로 옳지 않은 것은?",o:["셀에 삽입된 메모나 노트를 시트 끝에 인쇄되도록 설정할 수 있다.","셀 구분선이나 그림 개체를 제외하고 데이터만 인쇄하도록 설정할 수 있다.","워크시트의 행/열 머리글과 눈금선 인쇄를 설정할 수 있다.","용지 여백과 용지 크기를 설정할 수 있다."],a:3,e:"용지 여백은 '여백' 탭에서, 용지 크기는 '페이지' 탭에서 설정합니다."},
            {q:"부분합에 대한 설명으로 옳지 않은 것은?",o:["실행 시 목록에 개요가 자동으로 설정된다.","여러 함수를 이용하려면 함수의 개수만큼 부분합을 중첩해서 삽입해야 한다.","'새로운 값으로 대치'를 선택하면 이전 부분합이 제거되고 새 결과로 변경된다.","그룹화할 필드는 자동으로 오름차순 정렬하여 계산된다."],a:3,e:"부분합은 자동으로 정렬해주지 않으므로 실행 전 반드시 사용자가 직접 정렬을 해야 합니다."},
            {q:"워크시트 작업 및 관리에 대한 설명으로 옳지 않은 것은?",o:["시트 삭제 작업은 실행을 취소할 수 없다.","[Shift]+[F10]을 누르면 현재 시트 뒤에 새 워크시트가 삽입된다.","그룹화된 시트에서 데이터 입력 시 모든 시트에 동일 적용된다.","연속된 시트의 선택은 [Shift]를 사용하면 편리하다."],a:1,e:"새 워크시트 삽입 단축키는 [Shift]+[F11]이며, 현재 시트 '앞'에 삽입됩니다."},
            {q:"수식 오류 메시지와 발생 원인으로 옳지 않은 것은?",o:["#VALUE!: 잘못된 인수나 피연산자 사용 시","#DIV/0!: 0 또는 빈 셀로 나누었을 때","#NAME?: 함수 이름을 잘못 입력하거나 텍스트 인식 불가 시","#REF!: 숫자 인수가 필요한 함수에 다른 인수를 지정했을 때"],a:3,e:"#REF!는 참조한 셀이 삭제되거나 유효하지 않을 때 발생하는 오류입니다."},
            {q:"피벗 테이블에 대한 설명으로 옳지 않은 것은?",o:["원본 데이터가 변경되면 피벗 테이블 데이터도 자동으로 변경된다.","외부 데이터를 대상으로 작성할 수 있다.","새로운 수식을 추가하여 표시할 수 있다.","많은 양의 자료를 분석하여 요약해 주는 기능이다."],a:0,e:"원본 데이터 변경 시 [새로 고침] 버튼을 눌러야 피벗 테이블에 반영됩니다."},
            {q:"데이터 정렬에 대한 설명으로 옳지 않은 것은?",o:["사용자 지정 목록을 사용하여 원하는 순서대로 정렬할 수 있다.","글꼴 색 또는 셀 색을 기준으로 정렬할 수도 있다.","정렬 옵션을 이용해 열 방향 또는 행 방향 정렬이 가능하다.","표에 병합된 셀들이 포함되어 있는 경우 병합된 셀들은 맨 아래쪽으로 정렬된다."],a:3,e:"표에 병합된 셀이 포함되어 있을 경우 크기가 달라 정렬을 수행할 수 없습니다."},
            {q:"데이터 정렬에 대한 설명으로 옳지 않은 것은? (중복 출제 문항)",o:["사용자 지정 목록을 사용하여 원하는 순서대로 정렬할 수 있다.","글꼴 색 또는 셀 색을 기준으로 정렬할 수도 있다.","정렬 옵션을 이용해 열 방향 또는 행 방향 정렬이 가능하다.","표에 병합된 셀들이 포함되어 있는 경우 병합된 셀들은 맨 아래쪽으로 정렬된다."],a:3,e:"표에 병합된 셀이 포함되어 있을 경우 크기가 달라 정렬을 수행할 수 없습니다."},
            {q:"데이터 통합 기능에 대한 설명으로 옳지 않은 것은?",o:["'모든 참조 영역'에 다른 통합 문서의 워크시트를 추가할 수 있다.","참조 영역과 결과표의 레이블이 다르면 통합 결과표에 별도 행/열이 생성된다.","요약 함수로는 합계, 개수, 평균 등이 있다.","원본 데이터 연결 선택 시 참조 영역의 행/열이 변경될 때 자동으로 업데이트된다."],a:3,e:"데이터 값이 바뀔 때는 업데이트되지만, 행/열 구조(레이블) 자체가 변경되면 자동 업데이트되지 않습니다."},
            {q:"워크시트의 인쇄 영역 설정에 대한 설명으로 옳지 않은 것은?",o:["인쇄 영역을 정의하면 해당 영역만 인쇄된다.","인쇄 영역 설정을 해제하면 통합 문서의 모든 시트 인쇄 영역이 해제된다.","기존 인쇄 영역에 다른 영역을 추가하여 확대할 수 있다.","사용자가 설정한 인쇄 영역은 파일 저장 시 함께 저장된다."],a:1,e:"인쇄 영역 설정을 해제하면 현재 작업 중인 해당 워크시트의 인쇄 영역만 해제됩니다."},
            {q:"사용자 지정 목록에 대한 설명으로 옳지 않은 것은?",o:["정렬 기준이 셀 색, 조건부 서식 아이콘, 글꼴 색인 경우 사용자 지정 목록을 적용할 수 있다.","사용자 지정 목록은 컴퓨터 레지스트리에 추가된다.","기본 제공 목록은 수정하여 사용할 수 없다.","텍스트 또는 텍스트와 숫자의 조합이 포함될 수 있다."],a:0,e:"사용자 지정 목록은 정렬 기준이 '값(Value)'일 때에만 적용할 수 있습니다."},
            {q:"매크로에 관한 설명으로 옳지 않은 것은?",o:["같은 통합 문서 내에서 시트가 다르면 동일한 매크로 이름으로 기록할 수 있다.","바로 가기 키 지정 시 영문 대문자를 사용하면 [Shift]가 덧붙는다.","항상 사용하려면 저장 위치를 '개인용 매크로 통합 문서'로 선택한다.","매크로 보안 설정을 변경하여 제어할 수 있다."],a:0,e:"시트가 달라도 하나의 통합 문서 내에서는 동일한 이름의 매크로를 작성할 수 없습니다."},
            {q:"매크로 단축키 설정으로 옳지 않은 것은?",o:["[Alt] + [a]","[Ctrl] + [a]","[Ctrl] + [Shift] + [a]","[Ctrl] + [p]"],a:0,e:"매크로 단축키는 기본적으로 [Ctrl]과 조합하며 [Alt] 키는 사용할 수 없습니다."},
            {q:"부분합이 계산된 상태에서 새로운 부분합을 추가할 때 올바른 작업은?",o:["[모두 제거] 단추를 클릭","'새로운 값으로 대치' 설정을 해제","'그룹 사이에 페이지 나누기'를 설정","'데이터 아래에 요약 표시' 설정을 해제"],a:1,e:"기존 부분합 결과를 유지하면서 추가하려면 '새로운 값으로 대치' 체크를 반드시 해제해야 합니다."},
            {q:"차트에 대한 설명으로 옳지 않은 것은?",o:["숨겨진 데이터는 기본적으로 차트에 표시되지 않는다.","차트 제목, 범례 등은 마우스로 드래그하여 이동할 수 있다.","[Ctrl]을 누른 상태에서 차트 크기를 조절하면 셀에 맞춰 조절된다.","자주 사용하는 차트 종류를 서식 파일로 저장할 수 있다."],a:2,e:"차트 크기를 셀 눈금 선에 딱 맞게 조절하려면 [Alt] 키를 누른 상태에서 조절해야 합니다."},
            {q:"매크로의 실행 방법에 관한 설명으로 옳지 않은 것은?",o:["실행하려는 셀에서 마우스 우클릭 메뉴를 이용해 실행할 수 있다.","양식 도구의 '단추'를 만들어 연결해 실행할 수 있다.","바로 가기 키를 이용해서 실행할 수 있다.","매크로 대화상자에서 이름 선택 후 실행할 수 있다."],a:0,e:"엑셀 기본 기능 중 셀 자체를 마우스 우클릭하여 매크로를 바로 실행하는 메뉴는 없습니다."},
            {q:"도넛형 차트에 대한 설명으로 옳지 않은 것은?",o:["도넛 조각을 360도 이내로 회전할 수 있다.","데이터 계열을 추가할 수 있다.","도넛 구멍 크기를 0%~100%까지 설정할 수 있다.","가장 바깥쪽 테두리 조각을 분리할 수 있다."],a:2,e:"도넛형 차트의 구멍 크기는 최대 90%까지만 설정할 수 있습니다."},
            {q:"인쇄 작업을 위한 페이지 설정 사항으로 옳지 않은 것은?",o:["페이지 인쇄 순서를 행 우선/열 우선으로 지정할 수 있다.","노트가 삽입되어 있으면 기본적으로 같이 인쇄된다.","반복되는 행이 있으면 인쇄 제목을 설정할 수 있다.","인쇄 전 미리보기를 실행하여 여백을 확인할 수 있다."],a:1,e:"노트(메모) 인쇄는 기본 사항이 아니며, 인쇄하려면 페이지 설정 [시트] 탭에서 별도 지정해야 합니다."},
            {q:"[매크로] 대화상자에 대한 설명으로 옳지 않은 것은?",o:["매크로를 선택하고 [실행]을 클릭하면 실행된다.","[한 단계씩 코드 실행]을 클릭하면 과정별로 확인할 수 있다.","[만들기] 단추를 클릭하면 빠른 실행 도구 모음에 실행 명령을 추가한다.","[옵션] 단추를 클릭하면 바로 가기 키를 수정할 수 있다."],a:2,e:"[만들기] 단추를 클릭하면 VBE(Visual Basic Editor) 창이 열려 코드를 작성하게 됩니다."},
            {q:"[매크로 기록]에 관한 설명으로 옳지 않은 것은?",o:["매크로 이름 첫 글자는 반드시 문자여야 한다.","공백 및 밑줄로 단어를 구분할 수 있으며 셀 참조 매크로 이름을 사용할 수 있다.","바로 가기 키는 [Ctrl]과 함께 쓰며 특수문자나 숫자는 사용할 수 없다.","매크로 단축키가 엑셀 기본 단축키와 같으면 매크로 단축키가 우선한다."],a:1,e:"매크로 이름에 공백을 사용할 수 없고 셀 참조 주소 이름(예: A1)도 사용할 수 없습니다."},
            {q:"참조의 대상 범위로 사용하는 이름에 대한 설명으로 옳은 것은?",o:["이름 정의 시 첫 글자는 반드시 숫자로 시작해야 한다.","시트가 다르면 동일한 이름을 지정할 수 있다.","영문자는 대소문자를 구분하므로 주의하여야 한다.","기본적으로 절대 참조로 대상 범위를 참조한다."],a:3,e:"이름은 첫 글자 숫자 불가, 파일 내 중복 이름 불가, 대소문자 구분을 하지 않습니다."},
            {q:"데이터 통합에 대한 설명으로 옳지 않은 것은?",o:["참조 영역은 최대 3개까지만 추가가 가능하다.","요약 함수로는 합계, 개수, 평균, 최대값 등이 있다.","데이터의 순서와 위치가 동일하면 위치를 기준으로 통합할 수 있다.","형태가 다르더라도 레이블(이름표)을 기준으로 통합할 수 있다."],a:0,e:"통합할 참조 영역의 추가 개수에는 기본적으로 제한이 없습니다."},
            {q:"매크로에 관한 설명으로 옳지 않은 것은?",o:["서로 다른 매크로에 동일한 이름을 부여할 수 없다.","반복적인 작업을 자동화하여 단순 명령으로 실행하게 한다.","매크로 기록 시 마우스 동작은 기록되나 키보드 작업은 기록되지 않는다.","'상대 참조로 기록'을 설정하면 현재 셀 위치를 기준으로 기록된다."],a:2,e:"매크로 기록 시 마우스 클릭 등 동작뿐만 아니라 키보드 입력 작업도 모두 함께 기록됩니다."},
            {q:"페이지 나누기에 대한 설명으로 옳지 않은 것은?",o:["페이지 단위로 나누는 인쇄 구분선이다.","미리 보기 상태에서 마우스로 구분선을 끌어 위치를 조정할 수 있다.","행 높이와 열 너비를 변경해도 자동 페이지 나누기 구분선의 위치는 변경되지 않는다.","파선은 자동 페이지 나누기, 실선은 수동 페이지 나누기다."],a:2,e:"행 높이나 열 너비 변경 시 셀 영역 크기가 변하므로 자동 페이지 나누기 구분선 위치도 변경됩니다."},
            {q:"채우기 핸들에 대한 설명으로 옳은 것은?",o:["혼합된 셀의 채우기 핸들을 [Ctrl] 누르고 드래그하면 동일한 내용이 복사된다.","숫자가 입력된 두 셀 범위 지정 후 드래그하면 두 번째 셀 값이 복사된다.","숫자가 입력된 셀을 [Ctrl] 누르고 드래그하면 숫자가 1씩 감소한다.","목록 첫 항목 입력 후 [Ctrl]을 누르고 드래그하면 데이터가 연속 입력된다."],a:0,e:"문자/숫자 혼합 데이터는 그냥 끌면 1씩 증가하지만, [Ctrl]을 누르면 증가 없이 단순 복사됩니다."},
            {q:"창 나누기에 대한 설명으로 옳지 않은 것은?",o:["실행 시 최대 4개 부분으로 나눌 수 있다.","첫 행/열 제외 셀에서 실행 시 현재 셀 위쪽과 왼쪽에 분할선이 생긴다.","현재 창 나누기 상태를 유지하면서 추가로 창 나누기를 지정할 수 있다.","화면에 표시되는 창 나누기 형태는 인쇄 시 적용되지 않는다."],a:2,e:"창 나누기 상태에서 새로 나누기를 실행하면 이전 나누기는 취소되고 새 위치 기준으로 실행됩니다."},
            {q:"필터에 대한 설명으로 옳지 않은 것은?",o:["특정한 조건에 맞는 자료만 워크시트에 표시할 수 있다.","자동 필터에서 여러 필드 조건은 AND 조건으로 설정된다.","고급 필터 실행 시 조건 만족 데이터를 다른 곳에 추출할 수 있다.","고급 필터 결과 정렬 시 숨겨진 레코드도 정렬에 포함된다."],a:3,e:"데이터 정렬 시 숨겨진 행이나 열(필터링 되어 가려진 부분)은 정렬에 포함되지 않습니다."},
            {q:"[인쇄 미리 보기 및 인쇄]에 대한 설명으로 옳지 않은 것은?",o:["[Esc]를 눌러 화면을 종료할 수 있다.","차트를 선택하고 인쇄를 실행하면 선택한 차트만 미리 볼 수 있다.","화면 하단 '페이지 확대/축소'는 실제 인쇄 시 적용되지 않는다.","우측 하단 '여백 표시'를 클릭하면 '페이지 설정' 대화상자의 '여백' 탭이 표시된다."],a:3,e:"미리보기의 여백 표시를 누르면 시각적 점선 여백만 보일 뿐, 대화상자가 직접 뜨지는 않습니다."},
            {q:"[페이지 설정] - [머리글/바닥글] 탭 설명으로 옳지 않은 것은?",o:["홀/짝수 페이지 머리글을 다르게 지정할 수 있다.","첫 페이지 머리글을 다르게 지정할 수 있다.","인쇄될 워크시트를 실제 크기 백분율에 따라 확대/축소하려면 '문서에 맞게 배율 조정'을 선택한다.","머리글 공간 확보를 위해 '페이지 여백에 맞추기'를 선택한다."],a:2,e:"'문서에 맞게 배율 조정'은 워크시트 내용이 아니라 머리글/바닥글 텍스트 크기를 워크시트 배율에 맞추는 기능입니다."},
            {q:"매크로의 바로 가기 키에 대한 설명으로 옳지 않은 것은?",o:["바로 가기 키는 [옵션]에서 변경할 수 있다.","대문자로 지정하면 [Shift]가 자동으로 덧붙는다.","바로 가기 키를 설정하지 않아도 매크로를 생성할 수 있다.","엑셀에 기본 지정된 단축키는 매크로 바로 가기 키로 지정할 수 없다."],a:3,e:"엑셀 기본 단축키와 같게 지정할 수 있으며 이 경우 매크로 실행 단축키가 우선 적용됩니다."},
            {q:"데이터 표에 대한 설명으로 옳지 않은 것은?",o:["테스트 변수가 1개 또는 2개인 데이터 표를 만들 수 있다.","데이터 표를 이용하여 입력된 데이터는 부분적으로 수정 또는 삭제할 수 있다.","워크시트가 계산될 때 데이터 표도 다시 계산된다.","결과값은 변수를 포함한 수식이어야 한다."],a:1,e:"데이터 표 결과는 배열 형태를 띠므로 일부분의 셀만 선택하여 수정하거나 삭제할 수 없습니다."},
            {q:"작업 시트의 인쇄와 관련해서 옳지 않은 것은?",o:["행 머리글을 함께 인쇄할 수 있다.","페이지마다 인쇄 부수를 다르게 설정할 수 있다.","인쇄 페이지마다 똑같은 열 또는 행을 반복 인쇄할 수 있다.","셀 구분선을 함께 인쇄할 수 있다."],a:1,e:"엑셀에서 특정 페이지만 인쇄 부수를 다르게 할 수 없고 지정 부수만큼 전체가 인쇄됩니다."},
            {q:"정렬에 대한 설명으로 옳은 것은?",o:["최대 24개의 열을 기준으로 정렬할 수 있다.","글꼴 색을 기준으로 정렬할 수 있다.","병합된 셀이 포함되어 있어도 정렬할 수 있다.","숨겨진 행은 정렬 결과에 포함되나 숨겨진 열은 포함되지 않는다."],a:1,e:"정렬 기준은 64개까지 가능하며, 병합 셀 정렬 불가, 숨겨진 데이터도 정렬 제외, 글꼴/셀 색은 정렬 기준 가능합니다."},
            {q:"자동 필터에 대한 설명으로 옳지 않은 것은?",o:["목록 단추를 이용하여 쉽고 빠르게 데이터를 추출한다.","조건을 만족하지 않는 데이터를 잠시 숨기는 것이다.","추출한 데이터는 레코드 단위로 표시된다.","여러 필드를 대상으로 조건을 지정할 수 없다."],a:3,e:"다양한 필드마다 조건을 개별 지정할 수 있으며 모두 AND 조건으로 결합되어 표시됩니다."},
            {q:"'페이지 나누기' 기능에 관한 설명으로 옳지 않은 것은?",o:["미리 보기 상태에서는 데이터 입력이나 편집을 할 수 없다.","페이지 구분선을 마우스로 끌어 위치를 변경할 수 있다.","수동 삽입은 실선, 자동 추가는 파선이다.","한 페이지가 넘어가면 자동으로 페이지 구분선이 삽입된다."],a:0,e:"페이지 나누기 미리 보기 화면 상태에서도 일반 보기와 똑같이 데이터 입력 및 편집이 가능합니다."},
            {q:"머리글/바닥글 시작 페이지 번호를 100으로 설정하려면?",o:["바닥글 편집에서 100을 직접 텍스트로 입력한다.","[페이지 설정] - [페이지] - [자동 맞춤] 용지 번호에 입력한다.","[페이지 설정] - [페이지] - [시작 페이지 번호]에 표시될 번호 100을 입력한다.","[페이지 설정] - [설정] - [페이지 번호]에 100을 입력한다."],a:2,e:"시작 페이지 번호는 [페이지 설정] 대화상자의 [페이지] 탭 안에 있는 시작 페이지 번호에서 지정합니다."},
            {q:"데이터 통합에 관한 설명으로 옳지 않은 것은?",o:["위치 또는 이름을 정의하여 통합할 수 있다.","'원본 데이터에 연결' 기능은 통합할 데이터가 같은 통합 문서에 있는 경우에만 적용할 수 있다.","일치하지 않는 레이블이 있으면 별도의 행이나 열이 만들어진다.","여러 시트나 다른 통합 문서 데이터를 통합할 수 있다."],a:1,e:"'원본 데이터에 연결'은 통합할 원본과 결과물이 서로 '다른' 통합 문서(파일)에 있을 때만 사용 가능합니다."},
            {q:"[텍스트 나누기] 기능에 대한 설명으로 옳지 않은 것은?",o:["한 셀에 입력된 데이터를 여러 셀로 분리시킨다.","텍스트 나누기 시 데이터 형식 변환 및 셀 서식 변경이 가능하다.","데이터 서식을 일반으로 지정하면 숫자 값은 숫자로 변환된다.","구분 기호가 기본 제공되며 사용자가 원하는 한 가지만 선택할 수 있다."],a:3,e:"텍스트 나누기 마법사 2단계에서 두 가지 이상의 구분 기호를 동시 다중 선택하여 분리할 수 있습니다."},
            {q:"시나리오에 관한 설명으로 옳지 않은 것은?",o:["하나의 시나리오에 변경 셀을 최대 32개 지정할 수 있다.","요약 보고서나 피벗 테이블로 결과를 작성할 수 있다.","시나리오 병합으로 다른 통합 문서의 시나리오를 가져올 수 있다.","자료들을 그룹별로 분류하고 함수 계산 결과를 볼 수 있다."],a:3,e:"자료를 그룹화하여 계산 결과를 보는 기능은 시나리오가 아니라 '부분합' 기능입니다."},
            {q:"'페이지 나누기'에 대한 설명으로 옳지 않은 것은?",o:["행 높이와 열 너비를 변경하면 '자동 페이지 나누기' 위치도 변경된다.","수동 삽입된 페이지 나누기는 점선으로 표시된다.","구분선 제거는 셀 바로 가기 메뉴에서 선택할 수 있다.","용지 크기, 배율 옵션 등에 따라 자동 페이지 나누기가 삽입된다."],a:1,e:"미리 보기 화면에서 수동 삽입한 구분선은 실선, 자동 설정된 구분선은 점선(파선)으로 표시됩니다."},
            {q:"피벗 테이블에 대한 설명으로 옳지 않은 것은?",o:["원본 데이터가 변경되면 피벗 테이블의 데이터도 자동으로 변경된다.","외부 데이터를 대상으로 피벗 테이블을 작성할 수 있다.","작성한 후에 사용자가 새로운 수식을 추가하여 표시할 수 있다.","많은 양의 자료를 분석하여 요약하여 보여주는 기능이다."],a:0,e:"원본 데이터 수정 시 피벗 분석 메뉴에서 수동으로 [새로 고침]을 클릭해야 반영됩니다."}
        ];
        
        // 문항 수 체크 및 객체 배열 생성
        const questions = rawData.map((item, index) => ({
            id: index + 1,
            text: item.q,
            options: item.o,
            answerIndex: item.a,
            explanation: item.e
        }));

        let currentQuestionIndex = 0;
        let score = 0;
        let answeredQuestions = 0;
        let randomizedQuestions = [];
        const totalQuestions = questions.length; 

        // DOM Elements 선언
        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationContainer = document.getElementById('explanation-container');
        const explanationTextEl = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        
        // 모달 DOM
        const scoreBtn = document.getElementById('score-btn');
        const resultModal = document.getElementById('result-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalAnswered = document.getElementById('modal-answered');
        const modalCorrect = document.getElementById('modal-correct');
        const modalPercentage = document.getElementById('modal-percentage');

        function loadQuestion(index) {
            const question = randomizedQuestions[index];
            
            // UI 초기화
            explanationContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            // 문항 텍스트 및 프로그레스 세팅
            questionNumberEl.textContent = `문제 ${index + 1} / ${totalQuestions}`;
            questionTextEl.textContent = question.text;
            
            const progress = ((index) / totalQuestions) * 100;
            progressBar.style.width = `${progress}%`;

            // 보기 버튼 생성 (Flexbox 적용하여 모바일에서 깔끔하게 떨어지도록 함)
            question.options.forEach((optionText, i) => {
                const button = document.createElement('button');
                // Tailwind 모바일 대응 클래스 반영
                button.className = 'w-full text-left p-4 sm:p-5 rounded-xl border-2 border-gray-200 hover:border-blue-400 bg-white text-gray-700 font-medium option-button relative overflow-hidden flex items-start active:bg-gray-50';
                
                const numberLabels = ['①', '②', '③', '④'];
                // flex 컨테이너 내부 구조
                button.innerHTML = `
                    <span class="font-bold mr-3 text-gray-400 shrink-0 mt-0.5 text-lg">${numberLabels[i]}</span> 
                    <span class="leading-relaxed text-sm sm:text-base break-keep">${optionText}</span>
                `;
                
                button.onclick = () => selectOption(i, button);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIndex, selectedButton) {
            const question = randomizedQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.answerIndex;
            
            answeredQuestions++;
            if (isCorrect) {
                score++;
                // 🎊 Confetti 꽃가루 이펙트 발동! (모바일에서도 자연스러운 폭발)
                confetti({
                    particleCount: window.innerWidth < 600 ? 80 : 150,
                    spread: window.innerWidth < 600 ? 60 : 90,
                    origin: { y: 0.65 },
                    colors: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                    disableForReducedMotion: true
                });
            }

            // 모든 버튼 비활성화 및 정답/오답 마킹
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-blue-400', 'active:bg-gray-50');
                
                if (index === question.answerIndex) {
                    btn.classList.add('correct-answer', 'border-green-500', 'shadow-md');
                    btn.innerHTML += '<span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-green-600 text-xl font-bold bg-green-100 rounded-full w-8 h-8 flex items-center justify-center">✓</span>';
                } else if (index === selectedIndex && !isCorrect) {
                    btn.classList.add('wrong-answer', 'border-red-500');
                    btn.innerHTML += '<span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-red-600 text-xl font-bold bg-red-100 rounded-full w-8 h-8 flex items-center justify-center">✗</span>';
                } else {
                    btn.classList.add('opacity-40'); // 틀린 보기들은 희미하게 처리
                }
            });

            // 해설 표시
            explanationTextEl.innerText = question.explanation;
            explanationContainer.classList.remove('hidden');

            // 내비게이션 버튼 노출
            nextBtn.classList.remove('hidden');
            if (currentQuestionIndex < totalQuestions - 1) {
                nextBtn.textContent = '다음 문제';
            } else {
                nextBtn.textContent = '결과 보기';
                progressBar.style.width = '100%';
            }
            
            // 모바일 화면 배려: 하단으로 부드럽게 자동 스크롤
            setTimeout(() => {
                nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' }); // 새 문제 로드 시 맨 위로
            } else {
                showScoreModal();
            }
        });

        scoreBtn.addEventListener('click', showScoreModal);
        
        closeModalBtn.addEventListener('click', () => {
            resultModal.classList.add('hidden');
        });

        function showScoreModal() {
            modalAnswered.textContent = `${answeredQuestions} / ${totalQuestions}`;
            modalCorrect.textContent = score;
            
            const percentage = answeredQuestions === 0 ? 0 : Math.round((score / answeredQuestions) * 100);
            modalPercentage.textContent = `${percentage}%`;
            
            if (percentage >= 80) {
                modalPercentage.className = 'text-3xl font-black text-green-500';
            } else if (percentage >= 60) {
                modalPercentage.className = 'text-3xl font-black text-yellow-500';
            } else {
                modalPercentage.className = 'text-3xl font-black text-red-500';
            }

            // 모든 문제를 풀었을 경우 버튼 텍스트 변경
            if (currentQuestionIndex >= totalQuestions - 1 && answeredQuestions === totalQuestions) {
                 closeModalBtn.textContent = "다시 무작위로 풀기";
                 closeModalBtn.onclick = () => {
                     startQuiz(); // Shuffle & Restart
                     resultModal.classList.add('hidden');
                     closeModalBtn.textContent = "계속 풀기"; 
                     closeModalBtn.onclick = () => { resultModal.classList.add('hidden'); }; 
                 }
            }

            resultModal.classList.remove('hidden');
            resultModal.classList.add('flex');
        }

        function startQuiz() {
            // 문항 무작위 셔플 (100문제 랜덤)
            randomizedQuestions = [...questions].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;
            answeredQuestions = 0;
            window.scrollTo({ top: 0 });
            loadQuestion(0);
        }

        // 앱 시작
        window.onload = () => {
            startQuiz();
        };
    </script>
</body>
</html>
